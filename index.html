<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#fff" />
  <title>Release Notes</title>
  <style>
    @font-face {
      font-family: "Sandoll Gothic";
      src: local("Sandoll Gothic"), local("SDGothicNeo");
    }

    :root {
      --margin: clamp(24px, 6vw, 86px);
      --ko-size: clamp(30px, 5.2vw, 72px);
      --en-size: clamp(26px, 4.8vw, 66px);
      --fade: 2200ms cubic-bezier(.22, 1, .36, 1);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: #000;
      background: #fff;
      font-family: "Sandoll Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
    }

    main {
      display: flex;
      align-items: center;
      min-height: 100svh;
      padding: 8vh var(--margin);
    }

    #stage {
      position: relative;
      width: 100%;
      min-height: calc(var(--ko-size) * 1.15 + var(--en-size) * 1.2 + .13em);
    }

    .phrase {
      position: absolute;
      inset: 0;
      opacity: 0;
      filter: blur(3px);
      transform: translateY(1px);
      pointer-events: none;
      transition: opacity var(--fade), filter var(--fade), transform var(--fade);
    }

    .phrase.show {
      position: relative;
      opacity: 1;
      filter: blur(0);
      transform: none;
    }

    p { margin: 0; text-align: left; }
    .ko {
      font-size: var(--ko-size);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -.045em;
      word-break: keep-all;
    }
    .en {
      margin-top: .13em;
      font-size: var(--en-size);
      line-height: 1.2;
      letter-spacing: -.015em;
    }

    #status {
      position: fixed;
      left: var(--margin);
      bottom: 28px;
      color: #555;
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      .phrase { transition: none; filter: none; transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <section id="stage" aria-live="polite" aria-atomic="true">
      <div class="phrase show"><p class="ko"></p><p class="en"></p></div>
      <div class="phrase" aria-hidden="true"><p class="ko"></p><p class="en"></p></div>
    </section>
  </main>
  <div id="status" role="status"></div>

  <script>
    const DISPLAY_MS = 20000;
    const layers = [...document.querySelectorAll('.phrase')];
    const status = document.querySelector('#status');
    let phrases = [], queue = [], active = 0, position = 0;

    function csv(text) {
      const rows = [], row = [];
      let value = '', quoted = false;
      for (let i = 0; i < text.length; i++) {
        const char = text[i], next = text[i + 1];
        if (char === '"' && quoted && next === '"') { value += char; i++; }
        else if (char === '"') quoted = !quoted;
        else if (char === ',' && !quoted) { row.push(value.trim()); value = ''; }
        else if ((char === '\n' || char === '\r') && !quoted) {
          if (char === '\r' && next === '\n') i++;
          row.push(value.trim());
          if (row.some(Boolean)) rows.push(row.splice(0));
          value = '';
        } else value += char;
      }
      row.push(value.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function shuffle(items) {
      const result = [...items];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function refill(previous) {
      queue = shuffle(phrases);
      if (queue.length > 1 && queue[0] === previous) [queue[0], queue[1]] = [queue[1], queue[0]];
      position = 0;
    }

    function nextPhrase() {
      const previous = queue[position++];
      if (position === queue.length) refill(previous);
      return queue[position];
    }

    function paint(layer, phrase) {
      layer.querySelector('.ko').textContent = phrase.korean;
      layer.querySelector('.en').textContent = phrase.english;
    }

    function change(phrase) {
      const oldLayer = layers[active];
      const newLayer = layers[1 - active];
      paint(newLayer, phrase);
      newLayer.removeAttribute('aria-hidden');
      oldLayer.setAttribute('aria-hidden', 'true');
      newLayer.classList.remove('show');
      void newLayer.offsetWidth;
      newLayer.classList.add('show');
      oldLayer.classList.remove('show');
      active = 1 - active;
    }

    async function start() {
      try {
        const response = await fetch('./phrases.csv', { cache: 'no-store' });
        if (!response.ok) throw new Error('phrases.csv 파일을 찾을 수 없습니다.');
        phrases = csv(await response.text())
          .filter(([ko, en]) => ko && en)
          .map(([korean, english]) => ({ korean, english }));
        if (!phrases.length) throw new Error('CSV에 표시할 2열 문구가 없습니다.');
        refill();
        paint(layers[active], queue[position]);
        if (phrases.length > 1) setInterval(() => change(nextPhrase()), DISPLAY_MS);
      } catch (error) {
        paint(layers[0], { korean: '문구를 불러올 수 없습니다.', english: error.message });
        status.textContent = 'phrases.csv 파일과 CSV 형식을 확인하세요.';
      }
    }

    start();
  </script>
</body>
</html>
