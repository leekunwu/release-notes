<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>Release Notes</title>

  <style>
    @font-face {
      font-family: "Sandoll Gothic";
      src: local("Sandoll Gothic"), local("SDGothicNeo");
    }

    :root {
      --side-margin: clamp(24px, 6vw, 86px);
      --korean-size: clamp(30px, 5.2vw, 72px);
      --english-size: clamp(26px, 4.8vw, 66px);
      --transition-duration: 1600ms;
      --transition-easing: cubic-bezier(.22, 1, .36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
      font-family: "Sandoll Gothic", "Apple SD Gothic Neo", "Noto Sans KR", Arial, sans-serif;
    }

    main {
      display: flex;
      align-items: center;
      min-height: 100svh;
      padding: 8vh var(--side-margin);
    }

    .phrase-stage {
      position: relative;
      width: 100%;
      min-height: calc(
        var(--korean-size) * 1.15 +
        var(--english-size) * 1.2 +
        0.13em
      );
    }

    .phrase-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      opacity: 0;
      filter: blur(8px);
      transform: translateY(2px) scale(1.006);
      pointer-events: none;
      will-change: opacity, filter, transform;
      transition:
        opacity var(--transition-duration) var(--transition-easing),
        filter var(--transition-duration) var(--transition-easing),
        transform var(--transition-duration) var(--transition-easing);
    }

    .phrase-layer.is-visible {
      position: relative;
      opacity: 1;
      filter: blur(0);
      transform: translateY(0) scale(1);
    }

    .phrase-layer.is-exiting {
      opacity: 0;
      filter: blur(8px);
      transform: translateY(-2px) scale(1.006);
    }

    .ko,
    .en {
      margin: 0;
      text-align: left;
    }

    .ko {
      font-size: var(--korean-size);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.045em;
      word-break: keep-all;
    }

    .en {
      margin-top: 0.13em;
      font-size: var(--english-size);
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.015em;
    }

    #status {
      position: fixed;
      left: var(--side-margin);
      bottom: 28px;
      color: #555;
      font-size: 14px;
    }

    @media (prefers-reduced-motion: reduce) {
      .phrase-layer {
        transition: none;
        filter: none;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="phrase-stage" aria-live="polite" aria-atomic="true">
      <div class="phrase-layer is-visible" data-layer="0">
        <p class="ko"></p>
        <p class="en"></p>
      </div>

      <div class="phrase-layer" data-layer="1" aria-hidden="true">
        <p class="ko"></p>
        <p class="en"></p>
      </div>
    </section>
  </main>

  <div id="status" role="status"></div>

  <script>
    const CONFIG = {
      csvPath: './phrases.csv',
      displayDuration: 8000,
    };

    const layers = [...document.querySelectorAll('.phrase-layer')];
    const status = document.getElementById('status');
    const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    let phrases = [];
    let playlist = [];
    let activeLayerIndex = 0;
    let playlistIndex = 0;

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let field = '';
      let isQuoted = false;

      for (let index = 0; index < text.length; index += 1) {
        const character = text[index];
        const nextCharacter = text[index + 1];

        if (character === '"' && isQuoted && nextCharacter === '"') {
          field += '"';
          index += 1;
        } else if (character === '"') {
          isQuoted = !isQuoted;
        } else if (character === ',' && !isQuoted) {
          row.push(field.trim());
          field = '';
        } else if ((character === '\n' || character === '\r') && !isQuoted) {
          if (character === '\r' && nextCharacter === '\n') index += 1;
          row.push(field.trim());
          if (row.some(Boolean)) rows.push(row);
          row = [];
          field = '';
        } else {
          field += character;
        }
      }

      row.push(field.trim());
      if (row.some(Boolean)) rows.push(row);
      return rows;
    }

    function shuffle(items) {
      const shuffled = [...items];

      for (let index = shuffled.length - 1; index > 0; index -= 1) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [shuffled[index], shuffled[randomIndex]] = [shuffled[randomIndex], shuffled[index]];
      }

      return shuffled;
    }

    function buildPlaylist(previousPhrase) {
      playlist = shuffle(phrases);

      if (playlist.length > 1 && previousPhrase && playlist[0] === previousPhrase) {
        [playlist[0], playlist[1]] = [playlist[1], playlist[0]];
      }

      playlistIndex = 0;
    }

    function nextPhrase() {
      const currentPhrase = playlist[playlistIndex];
      playlistIndex += 1;

      if (playlistIndex >= playlist.length) {
        buildPlaylist(currentPhrase);
      }

      return playlist[playlistIndex];
    }

    function renderPhrase(layer, phrase) {
      layer.querySelector('.ko').textContent = phrase.korean;
      layer.querySelector('.en').textContent = phrase.english;
    }

    function transitionTo(phrase) {
      const outgoingLayer = layers[activeLayerIndex];
      const incomingLayer = layers[1 - activeLayerIndex];

      renderPhrase(incomingLayer, phrase);
      incomingLayer.setAttribute('aria-hidden', 'false');
      outgoingLayer.setAttribute('aria-hidden', 'true');

      incomingLayer.classList.remove('is-visible', 'is-exiting');
      void incomingLayer.offsetWidth;

      incomingLayer.classList.add('is-visible');
      outgoingLayer.classList.add('is-exiting');
      outgoingLayer.classList.remove('is-visible');

      activeLayerIndex = 1 - activeLayerIndex;
    }

    function scheduleTransition() {
      window.setTimeout(() => {
        transitionTo(nextPhrase());
        scheduleTransition();
      }, CONFIG.displayDuration);
    }

    function showError(error) {
      layers.forEach((layer) => layer.classList.remove('is-visible', 'is-exiting'));

      renderPhrase(layers[0], {
        korean: '문구를 불러올 수 없습니다.',
        english: error.message,
      });

      layers[0].classList.add('is-visible');
      status.textContent = 'phrases.csv 파일과 CSV 형식을 확인하세요.';
    }

    async function initialize() {
      try {
        const response = await fetch(CONFIG.csvPath, { cache: 'no-store' });

        if (!response.ok) {
          throw new Error('phrases.csv 파일을 찾을 수 없습니다.');
        }

        phrases = parseCSV(await response.text())
          .filter((row) => row.length >= 2 && row[0] && row[1])
          .map(([korean, english]) => ({ korean, english }));

        if (!phrases.length) {
          throw new Error('CSV에 표시할 2열 문구가 없습니다.');
        }

        buildPlaylist();
        renderPhrase(layers[activeLayerIndex], playlist[playlistIndex]);

        if (phrases.length > 1) {
          scheduleTransition();
        }
      } catch (error) {
        showError(error);
      }
    }

    if (reducedMotion) {
      document.documentElement.style.setProperty('--transition-duration', '0ms');
    }

    initialize();
  </script>
</body>
</html>
